name: Testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: python -m pip install numpy pycryptodome pytest
      - name: Testes dos leitores de formato
        run: python -m pytest -q tests
      - name: Todos os arquivos .py compilam
        run: python -m compileall -q gdboard gdtech_boardview.py tools tests
