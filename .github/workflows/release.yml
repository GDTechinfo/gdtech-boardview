# Gera os arquivos do release quando uma tag de versão é enviada (ex.: git tag v3.3.0 && git push --tags)
# ou quando é rodado à mão em Actions -> Release -> Run workflow.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: python -m pip install -r requirements.txt "pyinstaller>=6.6"
      - name: Executável (.exe)
        run: python tools/build_exe.py
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $ver = (python tools/get_version.py).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$ver" installer\GDTechBoardView.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\GDTech_BoardView.exe "out\GDTech_BoardView_${ver}_portatil.exe"
          Copy-Item "installer\Output\GDTech_BoardView_Setup_$ver.exe" out\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    # Ubuntu 22.04: o AppImage gerado aqui roda nas distros de 2022 para frente (Mint 21/22, Ubuntu 22.04/24.04...)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pacotes do sistema (Qt / OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libegl1 libgl1 libfuse2 libdbus-1-3
      - name: Bibliotecas
        run: python -m pip install -r requirements.txt "pyinstaller>=6.6"
      - name: Executável
        run: python tools/build_exe.py
      - name: AppImage
        run: bash tools/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: builds/*.AppImage

  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zip com os instaladores (INSTALAR.bat / INSTALAR_LINUX.sh)
        run: python tools/build_release.py
      - name: Notas da versão
        run: python tools/release_notes.py > builds/NOTAS.md
      - uses: actions/upload-artifact@v4
        with:
          name: zip
          path: builds/*

  publicar:
    needs: [windows, linux, zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: Versão
        id: v
        run: echo "ver=$(python3 tools/get_version.py)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.ver) }}
          name: GDTech BoardView ${{ steps.v.outputs.ver }}
          body_path: artefatos/NOTAS.md
          files: |
            artefatos/*.exe
            artefatos/*.AppImage
            artefatos/*.zip
